name: GPO Fishing Macro exe

# Сборка и тесты — на каждый push (без права записи в репозиторий).
# Обновление пользователям уходит ТОЛЬКО по тегу fishpilot-vX.Y.Z или ручному запуску с publish — задачей publish,
# у которой одной есть право писать релизы. Случайный или недоделанный push до людей не дойдёт.
on:
  push:
    # Если указать только tags, GitHub перестаёт запускать сборку на push в ветки — поэтому branches тоже
    branches:
      - "**"
    paths:
      - "gpo-fishing-macro/**"
      - ".github/workflows/gpo-fishing-macro.yml"
    tags:              # для тегов фильтр paths не применяется
      - "fishpilot-v*"
  workflow_dispatch:     # или вручную: Actions → «Run workflow» с галочкой publish
    inputs:
      publish:
        description: "Опубликовать обновление для пользователей"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: gpo-fishing-macro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pytest pip-licenses==5.0.0
      - name: Test
        timeout-minutes: 10
        run: python -m pytest -q -rs -s tests
      - name: Version
        id: version
        shell: pwsh
        run: |
          $ver = python -c "import macro; print(macro.__version__)"
          "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Version resource and licenses
        run: |
          python tools/build_meta.py version build\version.txt
          python tools/build_meta.py licenses build\THIRD_PARTY_LICENSES.txt
      # Основная сборка — папка (FishPilot.exe + _internal): быстрее запускается, реже пугает антивирусы
      - name: Build folder
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name FishPilot
          --version-file build\version.txt --icon assets\icon.ico --add-data "assets;assets"
          --collect-data customtkinter --collect-all winrt gpo_macro.py
      - name: Self-test (Windows OCR inside the build)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FishPilot\FishPilot.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\FishPilot\selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
          Remove-Item dist\FishPilot\selftest.txt
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\FishPilot\LICENSE.txt
          Copy-Item build\THIRD_PARTY_LICENSES.txt dist\FishPilot\
          Copy-Item README.md dist\FishPilot\README.md
          Compress-Archive -Path dist\FishPilot -DestinationPath dist\FishPilot-win64.zip -CompressionLevel Optimal
      # Одиночный exe — только чтобы версии 1.x (умеют обновлять один exe) один раз обновились и переехали в папку
      - name: Build legacy exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --noupx --name GPO-Fishing-Macro
          --version-file build\version.txt --icon assets\icon.ico --add-data "assets;assets"
          --collect-data customtkinter --collect-all winrt gpo_macro.py
      - uses: actions/upload-artifact@v4
        with:
          name: FishPilot
          path: |
            gpo-fishing-macro/dist/FishPilot-win64.zip
            gpo-fishing-macro/dist/GPO-Fishing-Macro.exe

  # Обновление прямо из программы: zip и exe в «плавающий» предварительный релиз gpo-latest.
  # Сначала файл, потом описание с версией и SHA-256 — программа не увидит новую версию раньше файла.
  # Предварительный и не «latest», чтобы не мешать релизам Mediavert и его автообновлению.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/fishpilot-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "fishpilot-v${{ needs.build.outputs.version }}" || {
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией ${{ needs.build.outputs.version }}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: FishPilot
          path: dist
      - name: Publish update (release gpo-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          sha=$(sha256sum dist/GPO-Fishing-Macro.exe | cut -d' ' -f1)
          zsha=$(sha256sum dist/FishPilot-win64.zip | cut -d' ' -f1)
          # Порядок строк важен: версии 1.x берут первую строку sha256 (это exe), 2.x — zip_sha256
          notes=$(printf '%s\n\nversion: %s\nsha256: %s\nzip_sha256: %s\ncommit: %s' \
            "FishPilot $VER — download FishPilot-win64.zip, unpack it and run FishPilot.exe. Free, MIT license. Not affiliated with Roblox or Grand Piece Online; automating the game may break its rules — use at your own risk." \
            "$VER" "$sha" "$zsha" "$GITHUB_SHA")
          if ! gh release view gpo-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create gpo-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "FishPilot $VER" --notes "Загрузка…"
          fi
          gh release upload gpo-latest dist/FishPilot-win64.zip dist/GPO-Fishing-Macro.exe --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit gpo-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "FishPilot $VER" --notes "$notes"
