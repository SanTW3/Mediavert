name: GPO Fishing Macro exe

on:
  push:
    paths:
      - "gpo-fishing-macro/**"
      - ".github/workflows/gpo-fishing-macro.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gpo-fishing-macro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name GPO-Fishing-Macro
          --icon assets\icon.ico --add-data "assets;assets" --collect-data customtkinter gpo_macro.py
      - uses: actions/upload-artifact@v4
        with:
          name: GPO-Fishing-Macro
          path: gpo-fishing-macro/dist/GPO-Fishing-Macro.exe
