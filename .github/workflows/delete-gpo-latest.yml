name: Delete gpo-latest release (one-off)

on:
  push:
    paths:
      - ".github/workflows/delete-gpo-latest.yml"

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag gpo-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete gpo-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
